<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1190" viewBox="0 0 1780 1190">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#49627a"/></marker>
  <style>
    .bg{fill:#f5f8fb}.card{fill:#fff;stroke:#526a80;stroke-width:2;rx:10}.head{fill:#dce9f5}.title{font:700 30px Arial;fill:#18334b}.subtitle{font:16px Arial;fill:#40586c}.name{font:700 19px Arial;fill:#18334b}.body{font:15px Consolas,monospace;fill:#243746}.line{stroke:#49627a;stroke-width:2;fill:none}.rel{font:14px Arial;fill:#284b67}.note{font:14px Arial;fill:#40586c}
  </style>
</defs>
<rect class="bg" width="1780" height="1190"/>
<text class="title" x="45" y="48">Pan, Puntos y Premios — Diagrama entidad-relación</text>
<text class="subtitle" x="45" y="76">Nueve tablas Oracle. PK: clave primaria; FK: clave foránea; UK: valor único.</text>

<path class="line" marker-end="url(#arrow)" d="M410 175 H610"/><text class="rel" x="475" y="161">1 cliente : varios pedidos</text>
<path class="line" marker-end="url(#arrow)" d="M1030 175 H1240"/><text class="rel" x="1080" y="161">0..1 pago por pedido</text>
<path class="line" marker-end="url(#arrow)" d="M820 385 V440"/><text class="rel" x="835" y="420">pedido contiene detalles</text>
<path class="line" marker-end="url(#arrow)" d="M410 535 H610"/><text class="rel" x="470" y="520">detalle de producto</text>
<path class="line" marker-end="url(#arrow)" d="M1030 535 H1240"/><text class="rel" x="1085" y="520">detalle de menú</text>
<path class="line" marker-end="url(#arrow)" d="M230 440 V400 H1410 V440"/><text class="rel" x="690" y="393">producto componente de menú (sándwich, bebida o acompañamiento)</text>
<path class="line" marker-end="url(#arrow)" d="M410 950 H610"/><text class="rel" x="480" y="935">recompensa</text>
<path class="line" marker-end="url(#arrow)" d="M410 260 H520 V790 H560 L610 880"/><text class="rel" x="526" y="750">cliente</text>
<path class="line" marker-end="url(#arrow)" d="M1480 685 V760 H1080 V900 H1030"/><text class="rel" x="1130" y="748">menu canjeado</text>
<path class="line" marker-end="url(#arrow)" d="M410 555 H460 V810 H580 L610 850"/><text class="rel" x="468" y="780">producto canjeado</text>
<path class="line" marker-end="url(#arrow)" d="M410 600 H475 V1110 H1240"/><text class="rel" x="490" y="1097">producto movido</text>
<path class="line" marker-end="url(#arrow)" d="M1030 260 H1120 V1000 H1240"/><text class="rel" x="1050" y="700">venta</text>
<path class="line" marker-end="url(#arrow)" d="M1030 1010 H1240"/><text class="rel" x="1070" y="995">canje</text>

<g transform="translate(45 105)"><rect class="card" width="365" height="270"/><path class="head" d="M10 0 H355 Q365 0 365 10 V42 H0 V10 Q0 0 10 0"/><text class="name" x="15" y="28">CLIENTES</text><text class="body" x="15" y="72">id_cliente NUMBER PK</text><text class="body" x="15" y="101">identificacion VARCHAR UK</text><text class="body" x="15" y="130">nombre VARCHAR</text><text class="body" x="15" y="159">telefono VARCHAR</text><text class="body" x="15" y="188">correo VARCHAR</text><text class="body" x="15" y="217">puntos NUMBER</text><text class="body" x="15" y="246">activo CHAR, fecha_registro TIMESTAMP</text></g>
<g transform="translate(610 105)"><rect class="card" width="420" height="280"/><path class="head" d="M10 0 H410 Q420 0 420 10 V42 H0 V10 Q0 0 10 0"/><text class="name" x="15" y="28">PEDIDOS</text><text class="body" x="15" y="72">id_pedido NUMBER PK</text><text class="body" x="15" y="101">id_cliente NUMBER FK</text><text class="body" x="15" y="130">fecha_creacion TIMESTAMP</text><text class="body" x="15" y="159">estado VARCHAR</text><text class="body" x="15" y="188">total NUMBER</text><text class="body" x="15" y="217">puntos_ganados NUMBER</text><text class="body" x="15" y="246">fecha_pago TIMESTAMP</text><text class="body" x="15" y="275">fecha_entrega TIMESTAMP</text></g>
<g transform="translate(1240 105)"><rect class="card" width="480" height="250"/><path class="head" d="M10 0 H470 Q480 0 480 10 V42 H0 V10 Q0 0 10 0"/><text class="name" x="15" y="28">PAGOS</text><text class="body" x="15" y="72">id_pago NUMBER PK</text><text class="body" x="15" y="101">id_pedido NUMBER FK, UK</text><text class="body" x="15" y="130">fecha_pago TIMESTAMP</text><text class="body" x="15" y="159">metodo VARCHAR, monto NUMBER</text><text class="body" x="15" y="188">efectivo_recibido NUMBER, cambio NUMBER</text><text class="body" x="15" y="217">referencia VARCHAR</text></g>

<g transform="translate(45 440)"><rect class="card" width="365" height="245"/><path class="head" d="M10 0 H355 Q365 0 365 10 V42 H0 V10 Q0 0 10 0"/><text class="name" x="15" y="28">PRODUCTOS</text><text class="body" x="15" y="72">id_producto NUMBER PK</text><text class="body" x="15" y="101">codigo VARCHAR UK</text><text class="body" x="15" y="130">categoria VARCHAR</text><text class="body" x="15" y="159">nombre VARCHAR, precio NUMBER</text><text class="body" x="15" y="188">stock NUMBER</text><text class="body" x="15" y="217">activo CHAR</text></g>
<g transform="translate(610 440)"><rect class="card" width="420" height="245"/><path class="head" d="M10 0 H410 Q420 0 420 10 V42 H0 V10 Q0 0 10 0"/><text class="name" x="15" y="28">DETALLE_PEDIDO</text><text class="body" x="15" y="72">id_detalle NUMBER PK</text><text class="body" x="15" y="101">id_pedido NUMBER FK</text><text class="body" x="15" y="130">id_producto NUMBER FK, nullable</text><text class="body" x="15" y="159">id_menu NUMBER FK, nullable</text><text class="body" x="15" y="188">cantidad NUMBER</text><text class="body" x="15" y="217">precio_unitario, puntos_unitarios</text></g>
<g transform="translate(1240 440)"><rect class="card" width="480" height="245"/><path class="head" d="M10 0 H470 Q480 0 480 10 V42 H0 V10 Q0 0 10 0"/><text class="name" x="15" y="28">MENUS</text><text class="body" x="15" y="72">id_menu NUMBER PK</text><text class="body" x="15" y="101">codigo VARCHAR UK, nombre VARCHAR</text><text class="body" x="15" y="130">id_sandwich NUMBER FK</text><text class="body" x="15" y="159">id_bebida NUMBER FK</text><text class="body" x="15" y="188">id_acompanamiento NUMBER FK</text><text class="body" x="15" y="217">precio NUMBER, activo CHAR</text></g>

<g transform="translate(45 835)"><rect class="card" width="365" height="230"/><path class="head" d="M10 0 H355 Q365 0 365 10 V42 H0 V10 Q0 0 10 0"/><text class="name" x="15" y="28">RECOMPENSAS</text><text class="body" x="15" y="72">id_recompensa NUMBER PK</text><text class="body" x="15" y="101">nombre VARCHAR</text><text class="body" x="15" y="130">categoria VARCHAR UK</text><text class="body" x="15" y="159">puntos_requeridos NUMBER</text><text class="body" x="15" y="188">activo CHAR</text></g>
<g transform="translate(610 835)"><rect class="card" width="420" height="250"/><path class="head" d="M10 0 H410 Q420 0 420 10 V42 H0 V10 Q0 0 10 0"/><text class="name" x="15" y="28">CANJES</text><text class="body" x="15" y="72">id_canje NUMBER PK</text><text class="body" x="15" y="101">id_cliente NUMBER FK</text><text class="body" x="15" y="130">id_recompensa NUMBER FK</text><text class="body" x="15" y="159">id_producto NUMBER FK, nullable</text><text class="body" x="15" y="188">id_menu NUMBER FK, nullable</text><text class="body" x="15" y="217">fecha_canje TIMESTAMP</text><text class="body" x="15" y="246">puntos_utilizados NUMBER</text></g>
<g transform="translate(1240 835)"><rect class="card" width="480" height="280"/><path class="head" d="M10 0 H470 Q480 0 480 10 V42 H0 V10 Q0 0 10 0"/><text class="name" x="15" y="28">MOVIMIENTOS_INVENTARIO</text><text class="body" x="15" y="72">id_movimiento NUMBER PK</text><text class="body" x="15" y="101">id_producto NUMBER FK</text><text class="body" x="15" y="130">fecha_movimiento TIMESTAMP</text><text class="body" x="15" y="159">tipo VARCHAR, cantidad NUMBER</text><text class="body" x="15" y="188">id_pedido NUMBER FK, nullable</text><text class="body" x="15" y="217">id_canje NUMBER FK, nullable</text><text class="note" x="15" y="253">Origen: reposición, venta o canje</text></g>

<text class="note" x="45" y="1158">Regla: DETALLE_PEDIDO y CANJES llevan exactamente uno de sus dos identificadores opcionales (producto o menú).</text>
</svg>
